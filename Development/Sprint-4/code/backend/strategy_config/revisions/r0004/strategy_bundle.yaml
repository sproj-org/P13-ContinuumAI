schema_version: 1
version: 1.1.0
strategic_context:
  company: SilkRoute Retail
  horizon: FY2026
  north_star_metric: net_sales_growth
  narrative: 'SilkRoute Retail is focused on profitable expansion across core metro
    markets while protecting cash flow and margin quality. The FY2026 plan prioritizes
    steady net sales growth through better assortment depth, stronger conversion in
    high-intent categories, and disciplined promotion design that preserves realized
    price.


    Alongside growth, the leadership team is doubling down on retention by improving
    repeat purchase frequency, reducing avoidable returns, and building segment-aware
    offers for loyal and price-sensitive cohorts. Marketing and merchandising teams
    are expected to coordinate campaign calendars with inventory posture so peak demand
    periods translate into profitable throughput instead of deep discounting.


    Inventory productivity remains a critical lever. Stores and supply teams are accountable
    for faster sell-through, lower stockout exposure on high-velocity SKUs, and healthier
    days-of-inventory. Decision rules in this strategy bundle are designed to escalate
    early when growth softens, margin deteriorates, or inventory risk rises beyond
    tolerance.'
pillars:
- id: growth
  description: Drive sustainable top-line expansion through channel and assortment
    execution.
  owner: commercial_director
- id: retention
  description: Increase repeat behavior and customer lifetime value across priority
    segments.
  owner: crm_lead
- id: margin
  description: Protect gross margin by controlling discount intensity and return leakage.
  owner: finance_controller
- id: inventory
  description: Improve inventory velocity and service levels while reducing stockout
    and overstock risk.
  owner: supply_chain_manager
swot:
  strengths:
  - Broad city footprint with omni-channel transaction coverage
  - Daily refreshed marts for sales, customer, and inventory health
  - High signal in discount, return, and store productivity metrics
  - Established private-label categories with strong repeat demand
  weaknesses:
  - Promotion decisions are still reactive in some regions
  - Inconsistent target ownership across growth and retention KPIs
  - Stockout risk remains elevated in top-selling SKUs
  - Campaign attribution data is incomplete for full-funnel ROI measurement
  opportunities:
  - Expand high-margin assortment in flagship and mall stores
  - Lift repeat rate through segment-specific offer orchestration
  - Use inventory health signals to tighten replenishment cadence
  - Standardize decision playbooks for margin and return control
  threats:
  - Price competition driving deeper discounting pressure
  - Demand volatility in seasonal categories
  - Supply-side delays increasing stockout and lost-sales risk
  - Return rate escalation in high-value categories
