decision_rules:
- id: rule_growth_guardrail
  condition: kpi("net_sales_growth") < target("net_sales_growth")
  action: Launch store-region growth recovery playbook and review demand drivers.
  severity: block
  rationale: Net sales growth must stay above plan to protect annual revenue commitments.
- id: rule_transactions_softening
  condition: kpi("transactions") < target("transactions")
  action: Run traffic and conversion diagnostics by channel and city.
  severity: warn
  rationale: Transaction softness usually appears before broader sales underperformance.
- id: rule_aov_deterioration
  condition: kpi("avg_order_value") < target("avg_order_value")
  action: Shift mix toward premium assortment and tighten markdown approvals.
  severity: warn
  rationale: AOV decline pressures growth and margin simultaneously.
- id: rule_retention_gap
  condition: kpi("repeat_customer_rate") < target("repeat_customer_rate")
  action: Trigger retention offers for at-risk segments and review CRM cadence.
  severity: warn
  rationale: Repeat behavior is required for stable quarterly growth.
- id: rule_margin_pressure
  condition: kpi("gross_margin_proxy") < target("gross_margin_proxy")
  action: Escalate pricing and discount governance with finance and merchandising.
  severity: block
  rationale: Margin compression beyond tolerance erodes profitability.
- id: rule_discount_spike
  condition: kpi("discount_rate") > target("discount_rate")
  action: Freeze non-strategic markdowns and audit campaign discount ladders.
  severity: warn
  rationale: Excessive discounting can mask demand weakness and hurt margin quality.
- id: rule_inventory_sell_through
  condition: kpi("sell_through_rate") < target("sell_through_rate")
  action: Prioritize inventory rebalancing and channel-level liquidation plans.
  severity: warn
  rationale: Slow sell-through raises carrying risk and future markdown pressure.
- id: rule_stockout_alert
  condition: kpi("stockout_rate") > target("stockout_rate")
  action: Trigger replenishment escalation for top decile SKUs.
  severity: block
  rationale: Stockouts directly reduce conversion and customer satisfaction.
- id: rule_returns_escalation
  condition: kpi("return_rate") > target("return_rate")
  action: Start root-cause review for quality issues and channel-specific return policies.
  severity: warn
  rationale: Returns growth can quickly erase net sales gains.
- id: rule_churn_risk_watch
  condition: kpi("customer_churn_risk") > target("customer_churn_risk")
  action: Deploy churn-prevention journey for medium and high-risk cohorts.
  severity: info
  rationale: Early churn signals should trigger proactive retention motions.
scoring_model:
  weights:
    kpi_coverage: 0.4
    rule_readiness: 0.2
    hierarchy_readiness: 0.2
    data_readiness: 0.2
