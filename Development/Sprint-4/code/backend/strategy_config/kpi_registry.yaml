      - store
      - geography
      - channel
    metric_aliases:
      - orders
      - order_count
      - transaction_volume
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_id
        - sales_date
      gold_store_360:
        - region
        - city
        - store_id
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: "3"
    description: Calculates the average value of transactions.
    formula: sum(net_sales)/nullif(sum(orders),0)
    marts:
      - gold_sales_daily
      - gold_store_360
    required_columns:
      - net_sales
      - orders
    dimensions:
      - channel_type
      - region
      - city
      - store_id
      - sales_date
    default_grain: month
    pillar_id: customer_experience
    owner: sales_team
    display_name: Average Basket Size
    semantic_family: basket
    business_concepts:
      - basket
      - pricing
      - store
      - channel
    metric_aliases:
