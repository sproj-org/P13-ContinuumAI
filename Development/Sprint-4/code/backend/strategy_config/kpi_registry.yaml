    derived_metrics: {}

  - id: "6"
    description: Tracks the frequency of stockouts for key SKUs.
    formula: sum(stockout_risk_flag)/nullif(count(stockout_risk_flag),0)
    marts:
      - gold_inventory_health_daily
    required_columns:
      - stockout_risk_flag
      - sku_id
    dimensions:
      - store_id
      - sku_id
      - snapshot_date
    default_grain: day
    pillar_id: inventory_management
    owner: inventory_team
    display_name: Stockout Rate
    semantic_family: inventory
    business_concepts:
      - inventory
      - stockout
      - sku
      - store
    metric_aliases:
      - stockout_rate
      - stockout
      - out_of_stock
    preferred_drill_path:
      - store_id
      - sku_id
      - snapshot_date
    mart_drill_overrides:
      gold_inventory_health_daily:
        - store_id
        - sku_id
        - snapshot_date
    terminal_dimensions:
      - sku_id
      - snapshot_date
    disallowed_drill_dimensions:
      - overstock_flag
    preferred_chart_types:
