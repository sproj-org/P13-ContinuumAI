      - campaign_spend
    dimensions:
      - channel_type
      - region
      - city
      - store_id
      - sales_date
    default_grain: week
    pillar_id: growth
    owner: marketing_analytics
    display_name: Campaign Lift
    semantic_family: marketing
    business_concepts:
