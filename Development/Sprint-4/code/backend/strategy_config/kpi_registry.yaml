      - basket_size
      - aov
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_id
        - sales_date
      gold_store_360:
        - region
        - city
        - store_id
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
