      - campaign
      - channel
      - store
    metric_aliases:
      - uplift
      - campaign_roi
      - promo_lift
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: "1"
    description: Measures the growth rate of net sales over a specified period.
    formula: sum(net_sales)
    marts:
      - gold_sales_daily
      - gold_store_360
    required_columns:
      - net_sales
    dimensions:
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: month
    pillar_id: profitability
    owner: sales_team
    display_name: Net Sales Growth
    semantic_family: revenue
    business_concepts:
      - revenue
      - store
      - geography
      - time
    metric_aliases:
      - net_sales
      - revenue
      - sales_value
    preferred_drill_path:
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - region
        - city
        - store_type
        - store_id
        - sales_date
      gold_store_360:
        - region
        - city
        - store_type
        - store_id
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions:
      - first_date
      - last_date
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: "2"
    description: Tracks the total number of transactions over a specified period.
    formula: sum(orders)
    marts:
