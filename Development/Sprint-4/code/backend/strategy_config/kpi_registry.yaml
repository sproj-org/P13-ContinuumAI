    dimensions:
      - channel_type
      - region
      - city
      - store_id
      - sales_date
    default_grain: day
    pillar_id: transaction_efficiency
    owner: sales_team
    display_name: Transaction Volume
    semantic_family: transactions
    business_concepts:
