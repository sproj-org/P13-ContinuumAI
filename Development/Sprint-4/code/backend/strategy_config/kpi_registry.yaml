      - pie
    derived_metrics: {}

aliases:
  revenue: net_sales
  gross_revenue: gross_sales
  aov: avg_order_value
  transaction_volume: transactions
  stockout: stockout_rate
  repeat_rate: repeat_customer_rate
  churn_risk: customer_churn_risk
  sell_through: sell_through_rate
derived_metrics:
  net_realization_rate: sum(net_sales_after_returns)/nullif(sum(gross_sales),0)
  discount_to_net_ratio: sum(discount_amount)/nullif(sum(net_sales),0)
  returns_to_gross_ratio: sum(returns_amount)/nullif(sum(gross_sales),0)
