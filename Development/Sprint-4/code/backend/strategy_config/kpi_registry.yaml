    derived_metrics: {}

  - id: campaign_lift
    description: Campaign efficiency proxy; intentionally unresolved until campaign marts are onboarded.
    formula: sum(campaign_sales)/nullif(sum(campaign_spend),0)
    marts:
      - gold_sales_daily
    required_columns:
