schema_version: 1
version: 1.2.0
kpis:
  - id: net_sales_growth
    description: 28-day net sales index versus the prior 28-day baseline.
    formula: sum(last_28d_net_sales)/nullif(sum(prev_28d_net_sales),0)
    marts:
      - gold_store_360
    required_columns:
      - last_28d_net_sales
      - prev_28d_net_sales
    dimensions:
      - region
      - city
      - store_type
      - store_id
    default_grain: month
    pillar_id: growth
    owner: commercial_analytics
    display_name: Net Sales Growth Index
    semantic_family: revenue
    business_concepts:
      - revenue
      - store
      - geography
      - growth
    metric_aliases:
      - revenue_growth
      - sales_growth
      - net_sales_growth
      - growth_index
    preferred_drill_path:
      - region
      - city
      - store_type
      - store_id
    mart_drill_overrides:
      gold_store_360:
        - region
        - city
        - store_type
        - store_id
    terminal_dimensions:
      - store_id
    disallowed_drill_dimensions:
      - first_date
      - last_date
      - needs_attention
    preferred_chart_types:
      - bar
      - line
    derived_metrics:
      growth_gap_to_baseline: sum(last_28d_net_sales)-sum(prev_28d_net_sales)

  - id: transactions
    description: Average transaction throughput proxy from daily order counts.
    formula: avg(orders)
    marts:
      - gold_sales_daily
    required_columns:
      - orders
    dimensions:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: day
    pillar_id: growth
    owner: retail_ops
    display_name: Transactions
    semantic_family: transactions
    business_concepts:
      - transactions
      - channel
      - store
      - geography
      - time
    metric_aliases:
      - orders
      - order_count
      - transactions
      - traffic
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_type
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: avg_order_value
    description: Average order value tracked at daily grain.
    formula: avg(avg_order_value)
    marts:
      - gold_sales_daily
    required_columns:
      - avg_order_value
    dimensions:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: day
    pillar_id: growth
    owner: commercial_analytics
    display_name: Average Order Value
    semantic_family: basket
    business_concepts:
      - basket
      - pricing
      - store
      - channel
    metric_aliases:
      - aov
      - avg_basket_value
      - basket_value
      - average_ticket
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_type
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: repeat_customer_rate
    description: Average active months as a retention engagement proxy.
    formula: sum(active_months)/nullif(count(active_months),0)
    marts:
      - gold_customer_360
    required_columns:
      - active_months
    dimensions:
      - segment
      - churn_risk_bucket
      - region
      - city
      - top_category
      - customer_id
    default_grain: month
    pillar_id: retention
    owner: crm_analytics
    display_name: Repeat Customer Activity
    semantic_family: customer_retention
    business_concepts:
      - customer
      - retention
      - segment
      - geography
    metric_aliases:
      - repeat_rate
      - repeat_customers
      - retention_activity
    preferred_drill_path:
      - segment
      - churn_risk_bucket
      - region
      - city
      - top_category
      - customer_id
    mart_drill_overrides:
      gold_customer_360:
        - segment
        - churn_risk_bucket
        - region
        - city
        - top_category
        - customer_id
    terminal_dimensions:
      - customer_id
    disallowed_drill_dimensions:
      - first_purchase_date
      - first_tx_date
      - last_tx_date
    preferred_chart_types:
      - bar
      - pie
    derived_metrics:
      active_month_gap: avg(active_months)-1

  - id: gross_margin_proxy
    description: Net-after-returns as a share of gross sales.
    formula: sum(net_sales_after_returns)/nullif(sum(gross_sales),0)
    marts:
      - gold_sales_daily
    required_columns:
      - net_sales_after_returns
      - gross_sales
    dimensions:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: day
    pillar_id: margin
    owner: finance_analytics
    display_name: Gross Margin Proxy
    semantic_family: margin
    business_concepts:
      - margin
      - store
      - channel
      - geography
    metric_aliases:
      - gross_margin
      - margin_rate
      - net_margin_proxy
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_type
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics:
      gross_margin_gap: sum(net_sales_after_returns)-sum(gross_sales)

  - id: discount_rate
    description: Discount spend ratio versus gross sales.
    formula: sum(discount_amount)/nullif(sum(gross_sales),0)
    marts:
      - gold_sales_daily
    required_columns:
      - discount_amount
      - gross_sales
    dimensions:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: day
    pillar_id: margin
    owner: pricing_analytics
    display_name: Discount Rate
    semantic_family: discount
    business_concepts:
      - discount
      - markdown
      - store
      - channel
    metric_aliases:
      - discount_ratio
      - markdown_rate
      - promo_discount_rate
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_type
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics:
      discount_to_net_ratio: sum(discount_amount)/nullif(sum(net_sales),0)

  - id: sell_through_rate
    description: 28-day units sold relative to current stock on hand.
    formula: sum(units_28d)/nullif(sum(stock_on_hand),0)
    marts:
      - gold_inventory_health_daily
    required_columns:
      - units_28d
      - stock_on_hand
    dimensions:
      - stockout_risk_flag
      - store_id
      - sku_id
      - snapshot_date
    default_grain: day
    pillar_id: inventory
    owner: inventory_analytics
    display_name: Sell Through Rate
    semantic_family: inventory
    business_concepts:
      - inventory
      - sku
      - store
      - stock_risk
    metric_aliases:
      - sell_through
      - sku_sell_through
      - stock_velocity
    preferred_drill_path:
      - stockout_risk_flag
      - store_id
      - sku_id
      - snapshot_date
    mart_drill_overrides:
      gold_inventory_health_daily:
        - stockout_risk_flag
        - store_id
        - sku_id
        - snapshot_date
    terminal_dimensions:
      - sku_id
      - snapshot_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics:
      units_to_stock_gap: sum(units_28d)-sum(stock_on_hand)

  - id: inventory_turnover
    description: Adjusted demand velocity over stock on hand.
    formula: sum(adj_avg_daily_units)/nullif(sum(stock_on_hand),0)
    marts:
      - gold_inventory_health_daily
    required_columns:
      - adj_avg_daily_units
      - stock_on_hand
    dimensions:
      - overstock_flag
      - store_id
      - sku_id
      - snapshot_date
    default_grain: day
    pillar_id: inventory
    owner: supply_chain_analytics
    display_name: Inventory Turnover Proxy
    semantic_family: inventory
    business_concepts:
      - inventory
      - turnover
      - sku
      - store
    metric_aliases:
      - stock_turn
      - turnover
      - inventory_velocity
    preferred_drill_path:
      - overstock_flag
      - store_id
      - sku_id
      - snapshot_date
    mart_drill_overrides:
      gold_inventory_health_daily:
        - overstock_flag
        - store_id
        - sku_id
        - snapshot_date
    terminal_dimensions:
      - sku_id
      - snapshot_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics:
      inventory_days_proxy: sum(stock_on_hand)/nullif(sum(adj_avg_daily_units),0)

  - id: stockout_rate
    description: Share of inventory rows flagged for stockout risk.
    formula: sum(stockout_risk_flag)/nullif(count(stockout_risk_flag),0)
    marts:
      - gold_inventory_health_daily
    required_columns:
      - stockout_risk_flag
    dimensions:
      - store_id
      - sku_id
      - snapshot_date
    default_grain: day
    pillar_id: inventory
    owner: supply_chain_analytics
    display_name: Stockout Risk Rate
    semantic_family: inventory
    business_concepts:
      - inventory
      - stockout
      - sku
      - store
    metric_aliases:
      - stockout
      - stockout_risk
      - out_of_stock_rate
    preferred_drill_path:
      - store_id
      - sku_id
      - snapshot_date
    mart_drill_overrides:
      gold_inventory_health_daily:
        - store_id
        - sku_id
        - snapshot_date
    terminal_dimensions:
      - sku_id
      - snapshot_date
    disallowed_drill_dimensions:
      - overstock_flag
    preferred_chart_types:
      - bar
      - pie
    derived_metrics: {}

  - id: return_rate
    description: Returns amount as a proportion of net sales.
    formula: sum(returns_amount)/nullif(sum(net_sales),0)
    marts:
      - gold_sales_daily
    required_columns:
      - returns_amount
      - net_sales
    dimensions:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: day
    pillar_id: retention
    owner: customer_experience
    display_name: Return Rate
    semantic_family: returns
    business_concepts:
      - returns
      - store
      - channel
      - geography
    metric_aliases:
      - returns_rate
      - refund_rate
      - return_ratio
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_type
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: units_per_transaction
    description: Units sold per order across channels.
    formula: sum(units)/nullif(sum(orders),0)
    marts:
      - gold_sales_daily
    required_columns:
      - units
      - orders
    dimensions:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    default_grain: day
    pillar_id: growth
    owner: retail_ops
    display_name: Units Per Transaction
    semantic_family: basket
    business_concepts:
      - basket
      - units
      - store
      - channel
    metric_aliases:
      - upt
      - units_per_order
      - basket_units
    preferred_drill_path:
      - channel_type
      - region
      - city
      - store_type
      - store_id
      - sales_date
    mart_drill_overrides:
      gold_sales_daily:
        - channel_type
        - region
        - city
        - store_type
        - store_id
        - sales_date
    terminal_dimensions:
      - store_id
      - sales_date
    disallowed_drill_dimensions: []
    preferred_chart_types:
      - bar
      - line
    derived_metrics: {}

  - id: customer_churn_risk
    description: Share of customers flagged as high return-risk proxy for churn behavior.
    formula: sum(return_rate_flag)/nullif(count(return_rate_flag),0)
    marts:
      - gold_customer_360
    required_columns:
      - return_rate_flag
    dimensions:
      - segment
      - churn_risk_bucket
      - region
      - city
      - customer_id
    default_grain: month
    pillar_id: retention
    owner: crm_analytics
    display_name: Customer Churn Risk
    semantic_family: customer_risk
    business_concepts:
      - customer
      - churn
      - risk
      - segment
    metric_aliases:
      - churn_risk
      - return_risk
      - attrition_risk
    preferred_drill_path:
      - segment
      - churn_risk_bucket
      - region
      - city
      - customer_id
    mart_drill_overrides:
      gold_customer_360:
        - segment
        - churn_risk_bucket
        - region
        - city
        - customer_id
    terminal_dimensions:
      - customer_id
    disallowed_drill_dimensions:
      - first_purchase_date
      - first_tx_date
      - last_tx_date
    preferred_chart_types:
