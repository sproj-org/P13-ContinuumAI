apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: continuum-app
type: Opaque
data:
  # Required
  DATABASE_URL: REPLACE_WITH_BASE64_DATABASE_URL
  JWT_SECRET_KEY: REPLACE_WITH_BASE64_JWT_SECRET_KEY

  # Optional but recommended (chat/agents)
  OPENAI_API_KEY: REPLACE_WITH_BASE64_OPENAI_API_KEY

  # Optional (alerts email)
  ALERT_EMAIL_TO: REPLACE_WITH_BASE64_ALERT_EMAIL_TO
  ALERT_EMAIL_FROM: REPLACE_WITH_BASE64_ALERT_EMAIL_FROM
  SMTP_USER: REPLACE_WITH_BASE64_SMTP_USER
  SMTP_PASSWORD: REPLACE_WITH_BASE64_SMTP_PASSWORD
