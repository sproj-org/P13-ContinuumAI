# ============================================
# Application Secrets for ContinuumAI
# ============================================
# IMPORTANT: This is a TEMPLATE file.
# DO NOT commit this file with real values to Git!
# 
# How to use:
# 1. Copy this file and name it secrets.yaml
# 2. Replace the base64 encoded values with your actual secrets
# 3. Apply manually: kubectl apply -f secrets.yaml -n continuum-app
#
# To encode a value to base64:
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your-secret-value"))
#   Linux/Mac:  echo -n "your-secret-value" | base64

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: continuum-app
type: Opaque
data:
  # Base64 encoded DATABASE_URL (your Supabase connection string)
  # Example: postgresql://user:password@host:5432/database
  DATABASE_URL: REPLACE_WITH_BASE64_ENCODED_DATABASE_URL
  
  # Base64 encoded JWT secret key
  JWT_SECRET_KEY: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET
