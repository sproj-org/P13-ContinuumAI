name: CD - Deploy to OKE
on:
  workflow_run:
    workflows: ["CI-GHCR"]
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  K8S_PATH: Development/Sprint-4/k8s

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config

          chmod 600 ~/.oci/oci_api_key.pem

      - name: Get kubeconfig
        run: |
          mkdir -p $HOME/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OKE_CLUSTER_OCID }} \
            --file $HOME/.kube/config \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          chmod 600 $HOME/.kube/config

      - name: Set KUBECONFIG environment
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Verify cluster connectivity
        run: |
          kubectl get nodes
          kubectl get namespaces

      - name: Create namespace
        run: kubectl apply -f $K8S_PATH/namespace.yaml

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            -n continuum-app \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app secrets
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ALERT_EMAIL_TO="${{ secrets.ALERT_EMAIL_TO }}" \
            --from-literal=ALERT_EMAIL_FROM="${{ secrets.ALERT_EMAIL_FROM }}" \
            --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
            --from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            -n continuum-app \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Backend
        run: |
          kubectl apply -f $K8S_PATH/backend-deployment.yaml -n continuum-app
          kubectl set image deployment/backend backend=$GHCR_IMAGE_PREFIX/backend:${{ github.event.workflow_run.head_sha }} -n continuum-app
          kubectl rollout status deployment/backend -n continuum-app --timeout=300s
          kubectl apply -f $K8S_PATH/backend-service.yaml -n continuum-app

      - name: Deploy Frontend
        run: |
          kubectl apply -f $K8S_PATH/frontend-deployment.yaml -n continuum-app
          kubectl set image deployment/frontend frontend=$GHCR_IMAGE_PREFIX/frontend:${{ github.event.workflow_run.head_sha }} -n continuum-app
          kubectl rollout status deployment/frontend -n continuum-app --timeout=300s
          kubectl apply -f $K8S_PATH/frontend-service.yaml -n continuum-app

      - name: Install NGINX Ingress Controller
        run: |
          kubectl get namespace ingress-nginx || \
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.1/deploy/static/provider/cloud/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s
          # Wait for LoadBalancer IP to be assigned
          echo "Waiting for Ingress Controller LoadBalancer IP..."
          sleep 30

      - name: Apply ingress
        run: |
          kubectl apply -f $K8S_PATH/ingress.yaml -n continuum-app
          kubectl get ingress -n continuum-app

      - name: Show deployment status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n continuum-app
          echo "=== Services ==="
          kubectl get svc -n continuum-app
          echo ""
          echo "============================================"
          echo "=== INGRESS CONTROLLER EXTERNAL IP ==="
          echo "============================================"
          kubectl get svc ingress-nginx-controller -n ingress-nginx
          echo ""
          echo "Use the EXTERNAL-IP from ingress-nginx-controller above to access your app!"
          echo "Example: http://EXTERNAL-IP"
          echo "=== Ingress ==="
          kubectl get ingress -n continuum-app
